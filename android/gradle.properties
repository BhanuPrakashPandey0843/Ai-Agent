# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Caps how many Gradle tasks/workers run concurrently. By default this is
# the CPU core count, which lets AGP launch a separate ninja/clang++ native
# build (armeabi-v7a, arm64-v8a, x86_64) IN PARALLEL for expo-modules-core's
# C++ sources. On this machine that concurrent load exhausts both physical
# RAM and the Windows pagefile, crashing ninja.exe with:
#   "ninja: error: exception: 0xE06D7363"
#   "MiniDumpWriteDump failed: The paging file is too small"
# Forcing workers.max=1 makes Gradle build each ABI's native code serially
# instead, so peak memory usage stays roughly 1/3 of the parallel case, at
# the cost of longer build time. This does not change build output, only
# scheduling. Raise this back up (or remove it) once more RAM/pagefile is
# available on this machine.
org.gradle.workers.max=1

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
#
# NOTE: 32-bit x86 (i686) intentionally excluded. x86 has no production use
# case (no real device ships 32-bit x86; Google Play does not require it) -
# it only ever mattered for legacy Intel emulator images, which modern
# emulators no longer use (they use x86_64 or arm64-v8a). The earlier build
# failure on the i686 target ("LLVM ERROR: out of memory" in clang++) and
# the later failure on x86_64 ("paging file is too small", see
# org.gradle.workers.max above) are the same underlying cause: this machine
# doesn't have enough RAM/pagefile to compile multiple ABIs' worth of heavy
# folly/JSI C++ templates at once. Dropping x86 permanently removes one
# unnecessary ABI's worth of memory pressure; org.gradle.workers.max=1
# addresses the rest by serializing the remaining ABI builds.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=false

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Enable GIF support in React Native images (~200 B increase)
expo.gif.enabled=true
# Enable webp support in React Native images (~85 KB increase)
expo.webp.enabled=true
# Enable animated webp support (~3.4 MB increase)
# Disabled by default because iOS doesn't support animated webp
expo.webp.animated=false

# Enable network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Use legacy packaging to compress native libraries in the resulting APK.
expo.useLegacyPackaging=false

# Google Play requires targetSdkVersion 35 (Android 15) as of Aug 2025.
# The Android Gradle Plugin bundled with react-native 0.74.5 (AGP 8.2.1)
# predates official compileSdk 35 support, so we explicitly allow it here.
# See android/build.gradle for the actual compileSdk/targetSdk = 35 values.
android.suppressUnsupportedCompileSdk=35
