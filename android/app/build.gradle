apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

static def versionToNumber(major, minor, patch) {
  return patch * 100 + minor * 10000 + major * 1000000
}

def getRNVersion() {
  def version = providers.exec {
    workingDir(projectDir)
    commandLine("node", "-e", "console.log(require('react-native/package.json').version);")
  }.standardOutput.asText.get().trim()

  def coreVersion = version.split("-")[0]
  def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }

  return versionToNumber(
      major,
      minor,
      patch
  )
}
def rnVersion = getRNVersion()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    if (rnVersion >= versionToNumber(0, 75, 0)) {
        /* Autolinking */
        autolinkLibrariesWithApp()
    }
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

// Release signing is loaded from android/keystore.properties, which is
// git-ignored and must be created locally / in CI (see keystore.properties.example).
// This intentionally does NOT fall back to the debug keystore for release
// builds — a missing keystore.properties fails the release build loudly
// instead of silently shipping a debug-signed AAB.
//
// EXCEPTION: on EAS Build, credentials are never provided via keystore.properties
// at all. EAS injects its own remote-managed keystore into signingConfigs.release
// via a separate build step (it writes and applies android/app/eas-build.gradle
// after this file is evaluated). `EAS_BUILD=true` is Expo's own documented,
// stable environment variable for detecting this — see
// https://docs.expo.dev/eas/environment-variables/usage/#built-in-environment-variables
// — rather than matching on working-directory paths or build output, which would
// break silently if EAS's infra details ever change.
def isEasBuild = System.getenv('EAS_BUILD') == 'true'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
def requiredKeystoreProps = ['RELEASE_STORE_FILE', 'RELEASE_STORE_PASSWORD', 'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD']
if (!isEasBuild && hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

    // Fail at configuration time, with a specific message, if keystore.properties
    // exists but is missing/blank values. Without this check, a null storeFile/
    // storePassword/keyAlias/keyPassword flows silently into signingConfigs.release
    // below, compiles and bundles fine, and only fails deep inside bundletool during
    // `:app:signReleaseBundle` with an opaque `java.lang.NullPointerException` that
    // gives no indication of which property was actually missing.
    def missingProps = requiredKeystoreProps.findAll { !keystoreProperties[it] }
    if (!missingProps.isEmpty()) {
        throw new GradleException(
            "android/keystore.properties is missing or has blank values for: ${missingProps.join(', ')}.\n" +
            "See android/keystore.properties.example for the required format."
        )
    }

    def releaseStoreFile = rootProject.file(keystoreProperties['RELEASE_STORE_FILE'])
    if (!releaseStoreFile.exists()) {
        throw new GradleException(
            "android/keystore.properties sets RELEASE_STORE_FILE=${keystoreProperties['RELEASE_STORE_FILE']}, " +
            "but no file exists at '${releaseStoreFile.absolutePath}'. RELEASE_STORE_FILE is resolved relative " +
            "to android/ (not android/app/) — place the .keystore/.jks file there or fix the path."
        )
    }
} else if (isEasBuild && hasReleaseKeystore) {
    // A keystore.properties happens to exist AND we're on EAS — harmless, but load
    // it anyway so a stray local file doesn't leave signingConfigs.release partially
    // populated from a mix of local + EAS-injected values. EAS's own injection step
    // runs after this file and will set the real values regardless.
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// If a release task (assembleRelease, bundleRelease, signReleaseBundle, ...) is
// actually requested locally (never on EAS) without android/keystore.properties
// existing at all, fail immediately and descriptively instead of letting AGP wire
// an all-null signingConfigs.release through to bundletool, which previously
// surfaced only as an opaque NullPointerException in `:app:signReleaseBundle`.
if (!isEasBuild) {
    gradle.taskGraph.whenReady { taskGraph ->
        def buildingRelease = taskGraph.allTasks.any { task ->
            def n = task.name
            n.contains('Release') && (n.startsWith('bundle') || n.startsWith('assemble') || n.startsWith('sign') || n.startsWith('package'))
        }
        if (buildingRelease && !hasReleaseKeystore) {
            throw new GradleException(
                "A release build was requested, but android/keystore.properties does not exist, " +
                "so signingConfigs.release has no storeFile/storePassword/keyAlias/keyPassword.\n" +
                "Copy android/keystore.properties.example to android/keystore.properties and fill in " +
                "your release keystore details before building a release variant.\n" +
                "(If this IS an EAS Build, EAS_BUILD should have been 'true' and this check should " +
                "have been skipped — something is misconfigured in the build environment.)"
            )
        }
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.faithframes.official'
    defaultConfig {
        applicationId 'com.faithframes.official'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Populated from android/keystore.properties (git-ignored, created locally
            // or in CI). If that file is missing, these fields are left unset, which
            // makes Gradle fail loudly on `assembleRelease`/`bundleRelease` instead of
            // silently signing a release artifact with the debug key.
            if (hasReleaseKeystore) {
                storeFile rootProject.file(keystoreProperties['RELEASE_STORE_FILE'])
                storePassword keystoreProperties['RELEASE_STORE_PASSWORD']
                keyAlias keystoreProperties['RELEASE_KEY_ALIAS']
                keyPassword keystoreProperties['RELEASE_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Release builds are signed with signingConfigs.release (from
            // keystore.properties), never with the debug keystore. See
            // android/keystore.properties.example for the required fields.
            signingConfig signingConfigs.release
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging')?.toBoolean() ?: false)
        }
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${reactAndroidLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${reactAndroidLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${reactAndroidLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

if (rnVersion < versionToNumber(0, 75, 0)) {
    apply from: new File(["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), "../native_modules.gradle");
    applyNativeModulesAppBuildGradle(project)
}
